async function deliveryForm(id){var r=id?await db.from("delivery_areas").select("*").eq("id",id).single():{data:{area_name:"",price:0,active:true}},x=r.data;editing=id;document.getElementById("modalbody").innerHTML='<h2>'+ (id?"تعديل منطقة":"منطقة جديدة")+'</h2><div class="field"><label>المنطقة</label><input id="da" value="'+esc(x.area_name)+'"></div><div class="field"><label>السعر ₪</label><input id="dp" type="number" value="'+x.price+'"></div><label><input id="dx" type="checkbox" '+(x.active?"checked":"")+'> مفعّلة</label><div class="actions"><button class="btn gold" onclick="saveDelivery()">حفظ</button><button class="btn ghost" onclick="closeModal()">إلغاء</button></div>';document.getElementById("modal").classList.remove("hide")}
async function saveDelivery(){var x={area_name:document.getElementById("da").value.trim(),price:Number(document.getElementById("dp").value||0),active:document.getElementById("dx").checked},r=editing?await db.from("delivery_areas").update(x).eq("id",editing):await db.from("delivery_areas").insert(x);toast(r.error?r.error.message:"تم الحفظ");closeModal();delivery()}
async function delDelivery(id){if(!confirm("حذف المنطقة؟"))return;var r=await db.from("delivery_areas").delete().eq("id",id);toast(r.error?r.error.message:"تم الحذف");delivery()}
async function settings(){var r=await db.from("store_settings").select("*").order("key"),o={};(r.data||[]).forEach(function(x){o[x.key]=x.value});var v=function(k,d){return o[k]!==undefined?(typeof o[k]=="string"?o[k]:JSON.stringify(o[k])):d};document.getElementById("content").innerHTML='<div class="card"><h2>إعدادات المتجر</h2><div class="grid"><div class="field"><label>اسم المتجر</label><input id="sn" value="'+esc(v("store_name","Espoza Fashion"))+'"></div><div class="field"><label>واتساب</label><input id="sw" value="'+esc(v("whatsapp",""))+'"></div><div class="field"><label>الترحيب</label><input id="ww" value="'+esc(v("welcome",""))+'"></div><div class="field"><label>مدة التوصيل</label><input id="dt" value="'+esc(v("delivery_time","2–3 أيام"))+'"></div></div><div class="field"><label>سياسة الاستبدال</label><textarea id="ep">'+esc(v("exchange_policy","الاستبدال خلال 24 ساعة. لا يوجد استرجاع إلا في حال وجود عيب تصنيع."))+'</textarea></div><button class="btn gold" onclick="saveSettings()">حفظ الإعدادات</button></div>'}
async function saveSettings(){var a=[["store_name",document.getElementById("sn").value],["whatsapp",document.getElementById("sw").value],["welcome",document.getElementById("ww").value],["delivery_time",document.getElementById("dt").value],["exchange_policy",document.getElementById("ep").value]];for(var i=0;i<a.length;i++){var r=await db.from("store_settings").upsert({key:a[i][0],value:a[i][1],updated_at:new Date().toISOString()},{onConflict:"key"});if(r.error)return toast(r.error.message)}toast("تم حفظ الإعدادات")}
function closeModal(){document.getElementById("modal").classList.add("hide");editing=null}
</script></body></html>
